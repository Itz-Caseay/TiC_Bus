<!DOCTYPE html>
<html>
<head>
<title>Book Bus</title>

<style>

body{
font-family: Arial;
background:#f4f4f4;
}

.booking-box{
width:400px;
margin:80px auto;
padding:30px;
background:white;
box-shadow:0 0 10px rgba(0,0,0,0.1);
border-radius:10px;
}

.booking-box h2{
text-align:center;
color:rgb(22,23,49);
}

.booking-box input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

.booking-box button{
width:100%;
padding:12px;
background:rgb(22,23,49);
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.booking-box button:hover{
background:skyblue;
}

</style>

</head>

<body>

<div class="booking-box">

<h2>Book Bus</h2>

<p><strong>Route:</strong> {{ route.origin }} → {{ route.destination }}</p>

<p><strong>Price:</strong> {{ route.price }} FCFA</p>

<p><strong>Bus:</strong> {{ bus.name }}</p>

<form method="POST">

{% csrf_token %}

<input type="number" name="seat_number" placeholder="Enter Seat Number" required>

<button type="submit">Confirm Booking</button>

</form>

</div>

</body>
</html>
