<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiC SuMmit - Signup</title>
</head>

<body>
    <br>
    <br>
    <br>
    <br>

    <center>
        <div class="submit">

            <form action="" method="post">
                {% csrf_token %}
                <span>Create Account</span><br>

                <input type="text" name="username" placeholder="Username" required>

                <input type="text" name="fullname" placeholder="Fullname" required>

                <input type="email" name="email" placeholder="Email Address" required>

                <input type="password" name="password" placeholder="Enter Password" required>

                <input type="password" name="password2" placeholder="Confirm Password" required>

                <button type="submit">Sign Up</button>

                <div class="forget">
                    <span>
                        <input type="checkbox" style="display: none;" checked required>
                    </span>
                </div>
            </form>

            <div class="left">
                <br><br><br><br>

                <h3>
                    Welcome To
                    <span style="font-size:45px; color:skyblue;">T.I.C</span>
                    <span style="font-size:45px; color:skyblue;">BUS</span>
                </h3>

                <p>
                    Already have an account?
                </p>

                <center>
                    <button>
                        <a href="{% url 'login' %}" style="color:white; text-decoration:none;">
                            Sign In
                        </a>
                    </button>
                </center>

            </div>
        </div>
    </center>


    <style>
        body {
            background: #ffffffff;
            color: black;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .submit {
            width: 80%;
            height: 650px;
            background: transparent;
            border: none;
            margin-right: 20px;
            box-shadow: 0 0 10px;
            display: flex;
        }

        .submit form {
            width: 50%;
            height: auto;
        }

        .submit form span {
            margin-top: 60px;
            font-size: 30px;
            padding: 10px;
            margin-left: 48px;
            display: flex;
        }

        .submit form input {
            width: 80%;
            height: 55px;
            margin: 10px 0;
            padding: 0 10px;
            border: none;
            padding-left: 15px;
            outline: none;
            border-radius: 50px;
            margin-top: 20px;
            background: #f2f2f2;
        }

        .submit form button {
            width: 85%;
            height: 60px;
            margin: 10px 0;
            padding: 0 10px;
            background: rgb(22, 23, 49);
            color: white;
            font-weight: bold;
            border: none;
            outline: none;
            border-radius: 50px;
            margin-top: 20px;
        }

        .submit form button:hover {
            background-color: transparent;
            color: rgb(22, 23, 49);
            border: 2px solid rgb(22, 23, 49);
            transition: 0.5s ease-in-out;
            cursor: pointer;
        }

        .submit form .forget {
            display: flex;
            width: 90%;
            height: auto;
            justify-content: space-between;
        }

        .submit form .forget span {
            width: 50%;
            font-size: 15px;
            display: flex;
            padding: 10px 0;
            margin: 10px;
            gap: 5px;
        }

        .submit form .forget span input {
            width: 20px;
            height: 20px;
            margin: 0px;
        }

        .submit .left {
            width: 50%;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 25px;
            color: white;
            background: rgb(22, 23, 49);
        }

        .submit .left p {
            font-size: 17px;
        }

        .submit .left button {
            width: 100px;
            height: 40px;
            color: white;
            background: transparent;
            border: 2px solid white;
            border-radius: 50px;
            cursor: pointer;
        }

        .submit .left button:hover {
            background: white;
            color: rgb(22, 23, 49);
            transition: 0.4s;
        }
    </style>

</body>

</html>
